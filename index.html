<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿QUE ES..? QUIMERA &bull; Ecosistema Científico, Académico y Profesional</title>
    <style>
        :root {
            --card-bg: rgba(15, 23, 42, 0.90);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #0f766e;
            --accent: #c88b32;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #000000;
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            transition: filter 1s ease;
        }

        body.blurring {
            filter: blur(12px);
        }

        /* Capa de fondo estática, nítida y completa */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(11, 19, 41, 0.01), rgba(11, 19, 41, 0.01)), url('Quimera.webp');
            background-size: cover;
            background-position: center center;
            z-index: -1;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .bg-image.visible {
            opacity: 1;
        }

        /* Capa de luz reactiva exclusiva del puntero */
        .cursor-light-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle 400px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(56, 189, 248, 0.18), rgba(200, 139, 50, 0.1) 45%, transparent 80%);
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .cursor-light-glow.visible {
            opacity: 1;
        }

        /* Canvas para Lluvia de Código Matrix */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        /* Clase de desvanecimiento a negro para elementos de la interfaz */
        .fade-out-element {
            opacity: 0 !important;
            pointer-events: none !important;
            transition: opacity 1.2s ease !important;
        }

        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            z-index: 9999;
            pointer-events: none;
            opacity: 1;
            transition: opacity 1s ease;
        }

        #intro-overlay.fade-out {
            opacity: 0;
        }

        /* Navegación Top Bar */
        .top-bar {
            background-color: rgba(11, 19, 41, 0.0);
            padding: 0.85rem 2rem;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            opacity: 0;
            transition: opacity 500ms ease;
        }

        .top-bar-container {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            color: #ffffff;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(0.85rem, 2vw, 1rem);
            font-weight: 700;
            text-decoration: none;
            letter-spacing: -0.01em;
            transition: color 0.2s ease, opacity 500ms ease;
        }

        .brand-logo:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        .nav-links {
            display: flex;
            gap: clamp(0.5rem, 2vw, 1.25rem);
            list-style: none;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: clamp(0.75rem, 1.5vw, 0.9rem);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        #audio-toggle, #fullscreen-toggle {
            background: rgba(15, 118, 110, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            transition: opacity 500ms ease, background-color 0.3s ease;
        }

        #audio-toggle:hover, #fullscreen-toggle:hover {
            background: var(--primary);
            color: #ffffff;
        }

        /* EFECTO LÁSER COMÚN PARA TÍTULO, QUIMERA Y SUBTÍTULO */
        .laser-burn-effect {
            opacity: 0;
            clip-path: inset(0 100% 0 0);
            position: relative;
        }

        .laser-burn-effect.active-laser {
            opacity: 1;
            animation: hyperLaserReveal 1.2s cubic-bezier(0.15, 1, 0.2, 1) forwards;
        }

        .laser-burn-effect.active-laser::before {
            content: '';
            position: absolute;
            top: -30px;
            bottom: -30px;
            left: 0;
            width: 16px;
            background: radial-gradient(circle, #ffffff 0%, #38bdf8 40%, #c88b32 80%, transparent 100%);
            box-shadow: 0 0 35px #38bdf8, 0 0 70px #fffbeb, 0 0 100px #c88b32, inset 0 0 15px #ffffff;
            animation: hyperLaserBarMove 1.2s cubic-bezier(0.15, 1, 0.2, 1) forwards;
            z-index: 15;
            filter: blur(0.5px);
        }

        .laser-burn-effect.active-laser::after {
            content: '';
            position: absolute;
            top: -10px;
            bottom: -10px;
            left: 0;
            right: 0;
            height: 120%;
            pointer-events: none;
            background: linear-gradient(90deg, rgba(255,255,255,0.9) 0%, rgba(56,189,248,0.6) 30%, rgba(200,139,50,0.3) 60%, transparent 100%);
            mix-blend-mode: color-dodge;
            animation: hyperLaserSparksWave 1.2s cubic-bezier(0.15, 1, 0.2, 1) forwards;
            z-index: 12;
        }

        @keyframes hyperLaserReveal {
            0% {
                clip-path: inset(0 100% 0 0);
                filter: brightness(4) contrast(200%) drop-shadow(0 0 30px rgba(56, 189, 248, 1));
            }
            50% {
                filter: brightness(2.5) contrast(150%) drop-shadow(0 0 15px rgba(200, 139, 50, 0.9));
            }
            100% {
                clip-path: inset(0 0 0 0);
                filter: brightness(1) contrast(100%) drop-shadow(0 0 0px transparent);
            }
        }

        @keyframes hyperLaserBarMove {
            0% {
                left: 0%;
                opacity: 1;
                transform: scaleY(1.8) skewX(-15deg);
            }
            50% {
                transform: scaleY(2.2) skewX(5deg);
            }
            90% {
                opacity: 1;
            }
            100% {
                left: 100%;
                opacity: 0;
                transform: scaleY(0.5) skewX(0deg);
            }
        }

        @keyframes hyperLaserSparksWave {
            0% {
                opacity: 1;
                clip-path: inset(0 100% 0 0);
            }
            100% {
                opacity: 0;
                clip-path: inset(0 0 0 0);
            }
        }

        .page-title {
            position: absolute;
            top: 07vh;
            left: 51%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.0rem, 09vw, 5rem);
            font-weight: 700;
            letter-spacing: 0em;
            text-transform: uppercase;
            color: #e2a547;
            display: inline-block;
            line-height: 1.1;
            -webkit-text-stroke: 1.5px #ffffff;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            z-index: 10;
        }

        .quimera-word-container {
            position: absolute;
            top: 65vh;
            left: 50%;
            transform: translateX(-50%);
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2.5rem, 10vw, 6rem);
            font-weight: 700;
            letter-spacing: 0.25em;
            line-height: 1.1;
            -webkit-text-stroke: 1.5px #000000;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.8);
            cursor: default;
            white-space: nowrap;
            z-index: 10;
        }

        .quimera-letter {
            display: inline-block;
            color: #ffffff;
            transition: color 0.4s ease;
        }

        .subtitle-text {
            position: absolute;
            top: calc(65vh + 5.5rem + 1.0rem);
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(1rem, 2vw, 1.3rem);
            font-weight: 700;
            line-height: 1.5;
            max-width: 900px;
            width: 90%;
            color: #ffffff;
            text-align: center;
            z-index: 10;
            -webkit-text-stroke: 0.75px #000000;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        }

        .exploration-box {
            position: absolute;
            top: 92.5vh;
            left: 50%;
            transform: translateX(-50%);
            max-width: 1075px;
            width: 100%;
            padding: 0.2rem 0.2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            font-size: clamp(0.8rem, 1.5vw, 0.9rem);
            color: #cbd5e1;
            opacity: 0;
            transition: opacity 0.8s ease;
            text-align: center;
            z-index: 10;
        }

        .exploration-box.visible {
            opacity: 1;
        }

        #exp-title {
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 0.2rem;
        }

        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 0.5rem 1rem;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            color: #ffffff;
            font-size: clamp(0.7rem, 1.2vw, 0.85rem);
            opacity: 0;
            transition: opacity 500ms ease;
            z-index: 100;
        }

        footer.visible {
            opacity: 1;
        }

        footer p {
            color: #e2e8f0;
        }

        @media (min-width: 1400px) and (max-width: 1920px) and (max-height: 1080px) {
            .page-title {
                top: 07vh;
                font-size: 5rem;
            }
            .quimera-word-container {
                top: 65vh;
            }
            .subtitle-text {
                top: calc(65vh + 5.5rem + 1.0rem);
            }
            .exploration-box {
                top: 92.5vh;
            }
        }

        @media (max-width: 900px) {
            body {
                height: auto;
                overflow-y: auto;
                overflow-x: hidden;
            }

            .bg-image {
                height: 100%;
                background-attachment: scroll;
            }

            .top-bar {
                position: relative !important;
                flex-direction: column;
                gap: 0.5rem;
                padding: 1rem;
                text-align: center;
            }

            .top-bar-container {
                flex-direction: column;
                gap: 0.8rem;
            }

            .nav-links {
                justify-content: center;
                gap: 0.8rem;
            }

            .page-title, .quimera-word-container, .subtitle-text, .exploration-box {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                width: 100% !important;
                max-width: 100% !important;
                margin: 1rem auto !important;
                text-align: center;
                white-space: normal !important;
            }

            .subtitle-text {
                padding: 0 1rem;
            }

            .exploration-box {
                padding: 1rem !important;
            }

            footer {
                position: relative !important;
                margin-top: 1.5rem;
                padding: 1rem;
            }
        }

        /* Recuadro Central Modal */
        #modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        #modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('Quimera_QE_Mod.jpg');
            background-size: cover;
            background-position: center center;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2.5rem;
            max-width: 750px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            text-align: center;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            transform-origin: center center;
        }

        /* EFECTO APAGADO DE TV ANTIGUA */
        @keyframes tvShutdown {
            0% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
            40% { transform: scale(1, 0.005); filter: brightness(3); opacity: 1; }
            70% { transform: scale(0.001, 0.005); filter: brightness(5); opacity: 1; }
            100% { transform: scale(0, 0); filter: brightness(0); opacity: 0; }
        }

        /* EFECTO DE ENTRADA: APAGADO DE TV ANTIGUA INVERTIDO */
        @keyframes tvTurnOn {
            0% { transform: scale(0, 0); filter: brightness(0); opacity: 0; }
            30% { transform: scale(0.001, 0.005); filter: brightness(5); opacity: 1; }
            60% { transform: scale(1, 0.005); filter: brightness(3); opacity: 1; }
            100% { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
        }

        .modal-box.crt-entry {
            animation: tvTurnOn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .modal-box.crt-exit {
            animation: tvShutdown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes blinkCursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .modal-box h2 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: 900;
            color: #c88b32;
            margin-bottom: 1rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            -webkit-text-stroke: 0.25px #ffffff;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.8);
        }

        .modal-box p, .modal-box li {
            font-size: clamp(0.9rem, 2vw, 1.02rem);
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 1rem;
            line-height: 1.6;
            -webkit-text-stroke: 0.3px #000000;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
        }

        .modal-box ul {
            padding-left: 1.25rem;
            margin-bottom: 1rem;
        }

        .process-flow {
            background: rgba(15, 118, 110, 0.2);
            border-left: 4px solid var(--primary);
            padding: 1rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: clamp(0.8rem, 1.5vw, 0.9rem);
            text-align: center;
            margin: 1rem 0;
            color: #5eead4;
        }

        .close-link {
            display: inline-block;
            color: #c88b32;
            font-weight: bold;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .close-link:hover {
            color: #e0a96d;
        }
    </style>
</head>
<body>

    <!-- Elemento de Audio -->
    <audio id="bg-music" src="Quimera_Milonga_(Lado_B).mp3" loop preload="auto"></audio>

    <!-- Capa de fondo estática, nítida y completa -->
    <div class="bg-image" id="bg-image"></div>
    
    <!-- Capa de luz reactiva exclusiva del puntero -->
    <div class="cursor-light-glow" id="cursor-light-glow"></div>

    <!-- Canvas para la Lluvia Matrix -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Capa de desvanecimiento inicial en blanco -->
    <div id="intro-overlay"></div>

    <!-- Navegación Top Bar -->
    <nav class="top-bar">
        <div class="top-bar-container">
            <a href="https://quimerac3.github.io/" class="brand-logo" data-text="QUIMERA - Indice General"></a>
            <ul class="nav-links">
                <li><a href="#" id="audio-toggle"><span style="color: #ffffff;">🎵</span> Música: OFF</a></li>
                <li><a href="#" id="fullscreen-toggle">⛶ Pantalla Completa</a></li>
            </ul>
        </div>
    </nav>

    <!-- Título principal con Hyper-Intense Laser -->
    <h1 class="page-title laser-burn-effect" id="main-title">¿QUÉ ES..?</h1>

    <!-- Palabra QUIMERA con Hyper-Intense Laser -->
    <div class="quimera-word-container laser-burn-effect" id="quimera-word">
        <span class="quimera-letter" data-index="0">Q</span><span class="quimera-letter" data-index="1">U</span><span class="quimera-letter" data-index="2">I</span><span class="quimera-letter" data-index="3">M</span><span class="quimera-letter" data-index="4">E</span><span class="quimera-letter" data-index="5">R</span><span class="quimera-letter" data-index="6">A</span>
    </div>

    <!-- Subtítulo con Hyper-Intense Laser -->
    <div class="subtitle-text laser-burn-effect" id="sub-text"></div>

    <div class="exploration-box" id="exp-box">
        <p id="exp-title"></p>
        <p id="exp-desc"></p>
    </div>

    <footer>
        <p data-text="&bull; &copy; 2026 Instituto Quimera. &bull; Centro de Investigación, Docencia, Servicio y Difusión. &bull; Dr.C. Cesar Cerezo Camacho. &bull; Todos los derechos reservados. &bull;"></p>
    </footer>

    <!-- Modal -->
    <div id="modal-backdrop">
        <div class="modal-box" id="modal-content-box">
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                window.location.reload();
            }
        });

        // CONTROL DE MOVIMIENTO DEL CURSOR (EXCLUSIVO PARA LA LUZ REACTIVA)
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            document.documentElement.style.setProperty('--mouse-x', `${x}px`);
            document.documentElement.style.setProperty('--mouse-y', `${y}px`);
        });

        // Control de Reproducción de Música
        const music = document.getElementById('bg-music');
        const audioToggle = document.getElementById('audio-toggle');
        let isMusicPlaying = false;

        audioToggle.addEventListener('click', (e) => {
            e.preventDefault();
            if (isMusicPlaying) {
                music.pause();
                audioToggle.innerHTML = '<span style="color: #ffffff;">🎵</span> Música: OFF';
                isMusicPlaying = false;
            } else {
                music.play().then(() => {
                    audioToggle.innerHTML = '<span style="color: #ffffff;">🎶</span> Música: ON';
                    isMusicPlaying = true;
                }).catch(error => {
                    console.log("Error al reproducir audio:", error);
                });
            }
        });

        // Control de Pantalla Completa
        const fullscreenToggle = document.getElementById('fullscreen-toggle');

        fullscreenToggle.addEventListener('click', (e) => {
            e.preventDefault();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fullscreenToggle.textContent = '❌ Salir Pantalla Completa';
                }).catch(err => {
                    console.log("Error al intentar entrar en pantalla completa:", err);
                });
            } else {
                document.exitFullscreen().then(() => {
                    fullscreenToggle.textContent = '⛶ Pantalla Completa';
                });
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenToggle.textContent = '⛶ Pantalla Completa';
            } else {
                fullscreenToggle.textContent = '❌ Salir Pantalla Completa';
            }
        });

        const modalData = [
            {
                title: "FUNDAMENTOS DEL ECOSISTEMA.",
                content: [
                    { type: 'p', text: "QUIMERA es un ecosistema científico, académico y profesional dedicado a generar, integrar, desarrollar y transferir conocimiento. Su propósito nace de una premisa sencilla:" },
                    { type: 'p', text: "Los problemas complejos requieren algo más que conocimiento especializado." },
                    { type: 'p', text: "Requieren la capacidad de conectar conocimientos." },
                    { type: 'p', text: "Por ello, QUIMERA reúne diferentes disciplinas, metodologías y campos profesionales relacionados con la ciencia, la salud, la medicina, la comunicación, el lenguaje, la educación y la tecnología, creando un espacio en el que el conocimiento puede ser estudiado, cuestionado, organizado, enseñado y aplicado." }
                ]
            },
            {
                title: "MÁS QUE INFORMACIÓN: CONOCIMIENTO CON PROPÓSITO.",
                content: [
                    { type: 'p', text: "QUIMERA no busca simplemente acumular información. Busca transformar la información en conocimiento comprensible, fundamentado y aplicable." },
                    { type: 'p', text: "Para ello, cada proyecto puede recorrer un proceso continuo:" },
                    { type: 'flow', text: "PREGUNTA → INVESTIGACIÓN → ANÁLISIS → CONOCIMIENTO → DESARROLLO → FORMACIÓN → APLICACIÓN → EVALUACIÓN" },
                    { type: 'p', text: "De esta manera, la investigación puede convertirse en formación; la formación, en práctica; y la práctica, nuevamente, en nuevas preguntas que impulsen el conocimiento." }
                ]
            },
            {
                title: "UN ESPACIO INTERDISCIPLINARIO.",
                content: [
                    { type: 'p', text: "Las fronteras entre disciplinas no siempre corresponden a las fronteras de los problemas reales. Por ello, QUIMERA favorece la interacción entre campos como:" },
                    { type: 'ul', items: [
                        "Medicina y ciencias de la salud.",
                        "Medicina Genómica y Biotecnología.",
                        "Medicina Basada en Evidencia.",
                        "Bioestadística y Metodología de la Investigación.",
                        "Medical Affairs.",
                        "Medical Writing y comunicación científica.",
                        "Interpretación Médica.",
                        "Traducción médica y científica.",
                        "Educación y desarrollo profesional.",
                        "Inteligencia Artificial y tecnología aplicada al conocimiento."
                    ]},
                    { type: 'p', text: "La interdisciplinariedad de QUIMERA no significa mezclar disciplinas indiscriminadamente, sino conectarlas conservando el rigor, los métodos y los límites propios de cada una." }
                ]
            },
            {
                title: "CONOCIMIENTO, METODOLOGÍA Y APLICACIÓN.",
                content: [
                    { type: 'p', text: "QUIMERA entiende que el conocimiento adquiere verdadero potencial cuando existe una relación coherente entre:" },
                    { type: 'flow', text: "QUÉ SABEMOS → CÓMO LO SABEMOS → CÓMO LO COMPRENDEMOS → CÓMO LO APLICAMOS → QUÉ RESULTADOS OBTENEMOS" },

        async function runIntroSequence() {
            const whiteOverlay = document.getElementById('intro-overlay');
            whiteOverlay.classList.add('fade-out');
            await new Promise(r => setTimeout(r, 1000));

            document.getElementById('bg-image').classList.add('visible');
            document.getElementById('cursor-light-glow').classList.add('visible');
            await new Promise(r => setTimeout(r, 1000));

            document.querySelector('.top-bar').style.opacity = '1';
            await new Promise(r => setTimeout(r, 400));

            const brandLogo = document.querySelector('.brand-logo');
            const logoText = brandLogo.dataset.text;
            let logoIdx = 0;
            await new Promise(resolveLogo => {
                function typeBrandLogo() {
                    if (logoIdx <= logoText.length) {
                        brandLogo.innerHTML = logoText.substring(0, logoIdx);
                        logoIdx++;
                        setTimeout(typeBrandLogo, 40);
                    } else {
                        resolveLogo();
                    }
                }
                typeBrandLogo();
            });
            await new Promise(r => setTimeout(r, 400));

            // 1. Entrada Láser para el Título Principal ¿QUÉ ES..?
            const mainTitle = document.getElementById('main-title');
            mainTitle.classList.add('active-laser');
            await new Promise(r => setTimeout(r, 1200));

            // 2. Entrada Láser para la palabra QUIMERA (respetando su posición y secuencia exacta)
            const quimeraWord = document.getElementById('quimera-word');
            quimeraWord.classList.add('active-laser');
            await new Promise(r => setTimeout(r, 1200));
            
            // Secuencia interna de colores para las letras de QUIMERA tras su entrada láser
            await playQuimeraAppearanceAsync();
            await new Promise(r => setTimeout(r, 400));

            // 3. Entrada Láser para el Subtítulo (respetando su posición y texto exacto)
            const subText = document.getElementById('sub-text');
            subText.textContent = 'Un ecosistema para el conocimiento, la formación y la práctica interdisciplinaria.';
            subText.classList.add('active-laser');
            await new Promise(r => setTimeout(r, 1200));

            document.getElementById('exp-box').classList.add('visible');
            await new Promise(r => setTimeout(r, 600));

            // Escritura del cuadro de exploración
            const expTitleEl = document.getElementById('exp-title');
            const exploreText = 'EXPLORACIÓN INTERACTIVA: Una vez que la palabra QUIMERA cambie de color a blanco, seleccione la letra parpadeante para descubrir: ¿Qué es QUIMERA?';
            expTitleEl.style.opacity = 1;
            let expIdx = 0;
            await new Promise(resolveExp => {
                function typeExp() {
                    if (expIdx < exploreText.length) {
                        expTitleEl.innerHTML += exploreText.charAt(expIdx);
                        expIdx++;
                        setTimeout(typeExp, 25);
                    } else {
                        resolveExp();
                    }
                }
                typeExp();
            });
            await new Promise(r => setTimeout(r, 400));

            document.querySelector('footer').classList.add('visible');
            await new Promise(r => setTimeout(r, 600));

            await new Promise(resolveFooter => {
                const footerPs = document.querySelectorAll('footer p');
                let pIndex = 0;
                function typeFooterP() {
                    if (pIndex >= footerPs.length) {
                        resolveFooter();
                        return;
                    }
                    let p = footerPs[pIndex];
                    let text = p.dataset.text.replace('2026', new Date().getFullYear());
                    let i = 0;
                    function typeChar() {
                        if (i <= text.length) {
                            p.innerHTML = text.substring(0, i);
                            i++;
                            setTimeout(typeChar, 18);
                        } else {
                            pIndex++;
                            setTimeout(typeFooterP, 100);
                        }
                    }
                    typeChar();
                }
                typeFooterP();
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(runIntroSequence, 400);

            document.querySelector('.brand-logo').addEventListener('click', (e) => {
                e.preventDefault();
                const overlay = document.getElementById('intro-overlay');
                overlay.style.background = '#ffffff';
                overlay.style.opacity = '1';
                overlay.classList.remove('fade-out');
                setTimeout(() => {
                    window.location.href = "https://quimerac3.github.io/";
                }, 500);
            });
        });

        const letters = document.querySelectorAll('.quimera-letter');
        let currentLetterIndex = 0;
        let selectedCount = 0;
        let activeBlinkInterval = null;
        let globalColorInterval = null;

        function playQuimeraAppearanceAsync() {
            return new Promise(resolve => {
                let idx = 0;
                function showNextRed() {
                    if (idx < letters.length) {
                        letters[idx].style.color = '#c88b32';
                        idx++;
                        setTimeout(showNextRed, 200);
                    } else {
                        setTimeout(showWhiteLetters, 250);
                    }
                }
                function showWhiteLetters() {
                    let jdx = 0;
                    function showNextWhite() {
                        if (jdx < letters.length) {
                            letters[jdx].style.color = '#ffffff';
                            jdx++;
                            setTimeout(showNextWhite, 150);
                        } else {
                            activateCurrentLetter();
                            resolve();
                        }
                    }
                    showNextWhite();
                }
                showNextRed();
            });
        }

        function activateCurrentLetter() {
            if (currentLetterIndex >= letters.length) return;
            const targetLetter = letters[currentLetterIndex];
            let isWhite = true;

            activeBlinkInterval = setInterval(() => {
                targetLetter.style.color = isWhite ? '#c88b32' : '#ffffff';
                isWhite = !isWhite;
            }, 250);

            targetLetter.style.cursor = 'pointer';
            targetLetter.onclick = () => handleLetterClick(currentLetterIndex);
        }

        function handleLetterClick(index) {
            const targetLetter = letters[index];
            targetLetter.onclick = null;
            clearInterval(activeBlinkInterval);

            let blinks = 0;
            let isWhite = false;
            const blinkFive = setInterval(() => {
                targetLetter.style.color = isWhite ? '#ffffff' : '#c88b32';
                isWhite = !isWhite;
                blinks++;
                if (blinks >= 10) {
                    clearInterval(blinkFive);
                    targetLetter.style.color = '#ffffff';

                    if (index === 6) {
                        triggerMatrixAndFadeElements();
                    }

                    showModalTyped(index);
                }
            }, 100);
        }

        function triggerMatrixAndFadeElements() {
            const bgImg = document.getElementById('bg-image');
            if (bgImg) bgImg.classList.remove('visible');

            const cursorGlow = document.getElementById('cursor-light-glow');
            if (cursorGlow) cursorGlow.classList.remove('visible');

            const elementsToFade = [
                document.getElementById('main-title'),
                document.getElementById('quimera-word'),
                document.querySelector('.top-bar'),
                document.getElementById('sub-text'),
                document.getElementById('exp-box'),
                document.querySelector('footer')
            ];

            elementsToFade.forEach(el => {
                if (el) el.classList.add('fade-out-element');
            });

            startMatrixRain();
            const canvas = document.getElementById('matrix-canvas');
            if (canvas) canvas.style.opacity = '1';
        }

        let matrixInterval = null;
        function startMatrixRain() {
            const canvas = document.getElementById('matrix-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZカタカナアアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            const fontSize = 16;
            let columns = Math.floor(canvas.width / fontSize);
            let drops = Array(columns).fill(1);

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = chars.charAt(Math.floor(Math.random() * chars.length));

                    if (Math.random() > 0.88) {
                        ctx.fillStyle = '#fffbeb';
                    } else {
                        ctx.fillStyle = '#c88b32';
                    }

                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            if (matrixInterval) clearInterval(matrixInterval);
            matrixInterval = setInterval(draw, 33);
        }

        async function showModalTyped(index) {
            const backdrop = document.getElementById('modal-backdrop');
            const modalBox = document.getElementById('modal-content-box');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');

            modalBox.classList.remove('crt-exit');
            modalBox.classList.add('crt-entry');
            
            modalTitle.innerHTML = "";
            modalBody.innerHTML = "";
            
            backdrop.classList.add('active');

            const data = modalData[index];
            
            await typeWriterHTML(modalTitle, data.title, 25);

            for (let item of data.content) {
                if (item.type === 'p') {
                    let pElem = document.createElement('p');
                    modalBody.appendChild(pElem);
                    await typeWriterHTML(pElem, item.text, 12);
                } else if (item.type === 'flow') {
                    let flowElem = document.createElement('div');
                    flowElem.className = 'process-flow';
                    modalBody.appendChild(flowElem);
                    await typeWriterHTML(flowElem, item.text, 12);
                } else if (item.type === 'ul') {
                    let ulElem = document.createElement('ul');
                    modalBody.appendChild(ulElem);
                    for (let liText of item.items) {
                        let liElem = document.createElement('li');
                        ulElem.appendChild(liElem);
                        await typeWriterHTML(liElem, liText, 12);
                    }
                }
            }

            let closeContainer = document.createElement('div');
            closeContainer.style.textAlign = 'right';
            closeContainer.style.marginTop = '1.5rem';

            let closeBtn = document.createElement('span');
            closeBtn.className = 'close-link';
            closeBtn.id = 'modal-close-btn';
            closeBtn.textContent = 'Cerrar.';

            let cursor = document.createElement('span');
            cursor.style.display = 'inline-block';
            cursor.style.width = '8px';
            cursor.style.height = '1.1em';
            cursor.style.background = '#c88b32';
            cursor.style.marginLeft = '4px';
            cursor.style.verticalAlign = 'middle';
            cursor.style.animation = 'blinkCursor 0.8s infinite';

            closeContainer.appendChild(closeBtn);
            closeContainer.appendChild(cursor);
            modalBody.appendChild(closeContainer);

            const triggerClose = () => {
                closeBtn.onclick = null;
                backdrop.onclick = null;

                modalBox.classList.remove('crt-entry');
                modalBox.classList.add('crt-exit');
                backdrop.classList.remove('active');

                setTimeout(() => {
                    letters[index].style.color = '#c88b32';
                    currentLetterIndex++;
                    selectedCount++;

                    if (selectedCount < 7) {
                        activateCurrentLetter();
                    } else {
                        enableFinalHyperlink();
                    }
                }, 400);

                setTimeout(() => {
                    modalBox.classList.remove('crt-exit');
                }, 800);
            };

            closeBtn.onclick = triggerClose;
            backdrop.onclick = (e) => {
                if (e.target === backdrop) {
                    triggerClose();
                }
            };
        }

        async function typeWriterHTML(element, htmlString, speed = 20) {
            return new Promise(resolve => {
                element.innerHTML = '';
                const tokens = htmlString.match(/(<\/?[^>]+(>|$)|[^<]+)/g) || [htmlString];
                let tokenIdx = 0;
                let charIdx = 0;
                
                function type() {
                    if (tokenIdx < tokens.length) {
                        let currentToken = tokens[tokenIdx];
                        if (currentToken.startsWith('<')) {
                            element.innerHTML += currentToken;
                            tokenIdx++;
                            setTimeout(type, speed);
                        } else {
                            if (charIdx < currentToken.length) {
                                element.innerHTML += currentToken.charAt(charIdx);
                                charIdx++;
                                setTimeout(type, speed);
                            } else {
                                charIdx = 0;
                                tokenIdx++;
                                setTimeout(type, speed);
                            }
                        }
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        function enableFinalHyperlink() {
            const wordContainer = document.getElementById('quimera-word');
            wordContainer.style.cursor = 'pointer';

            const stepTime = 120;

            function runSequence() {
                let i = 0;
                function turnCopperGold(callback) {
                    if (i < letters.length) {
                        letters[i].style.color = '#c88b32';
                        i++;
                        globalColorInterval = setTimeout(() => turnCopperGold(callback), stepTime);
                    } else if (callback) {
                        callback();
                    }
                }

                let j = 0;
                function turnWhite(callback) {
                    if (j < letters.length) {
                        letters[j].style.color = '#ffffff';
                        j++;
                        globalColorInterval = setTimeout(() => turnWhite(callback), stepTime);
                    } else if (callback) {
                        callback();
                    }
                }

                turnCopperGold(() => {
                    i = 0;
                    turnWhite(() => {
                        j = 0;
                        globalColorInterval = setTimeout(runSequence, 0);
                    });
                });
            }

            runSequence();

            wordContainer.onclick = () => {
                clearTimeout(globalColorInterval);

                document.body.classList.add('blurring');

                const overlay = document.getElementById('intro-overlay');
                overlay.style.background = '#ffffff';
                overlay.style.opacity = '1';
                overlay.classList.remove('fade-out');

                setTimeout(() => {
                    window.location.href = "https://quimerac3.github.io/QuimeraC3-Q/";
                }, 1000);
            };
        }
    </script>
